{% extends "base.html" %}
{% block title %}Register - DIP{% endblock %}
{% block content %}
<div style="max-width:420px;margin:60px auto;">
  <div class="page-header" style="text-align:center;">
    <h1>DI<span style="color:var(--accent)">P</span></h1>
    <p>Create your account</p>
  </div>
  <div class="card">
    <h2>Register</h2>
    <form method="POST">
      <label>Choose a username</label>
      <input type="text" name="username" required autofocus>
      <label>Choose a password</label>
      <input type="password" name="password" required>
      <button class="btn" type="submit" style="width:100%">Create Account</button>
    </form>
    <p style="text-align:center;margin-top:16px;font-size:0.88rem;color:var(--text-muted)">
      Already have an account? <a href="{{ url_for('login') }}">Log in</a>
    </p>
  </div>
  {% if console %}
  <div class="card"><h2>Console Output</h2><pre class="console">{{ console }}</pre></div>
  {% endif %}
</div>
{% endblock %}
